[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-copilot"
version = "0.1.0"
description = "Educational AI-assisted code review CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
code-review-copilot = "code_review_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
